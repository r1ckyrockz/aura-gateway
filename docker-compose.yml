# Quick start: AURA Gateway + Ollama on one box.
#   cp .env.example .env && cp examples/aura.config.yaml aura.config.yaml
#   docker compose up -d && docker compose exec ollama ollama pull qwen3:8b
services:
  aura-gateway:
    build: .
    image: ghcr.io/r1ckyrockz/aura-gateway:latest
    restart: unless-stopped
    env_file: .env
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
    ports:
      - '8080:8080'
    volumes:
      - ./aura.config.yaml:/config/aura.config.yaml:ro
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Uncomment for NVIDIA GPUs (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama:
